# ---------------------------------------------------------------------------
# Sentio production deployment (one command):
#
#   1. bash deploy/gen-certs.sh                    (self-signed TLS cert)
#   2. .venv/bin/uvicorn api.main:app --port 8000  (API, localhost only)
#   3. docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Public surface: 80 -> 443 (nginx, TLS, built SPA + /api proxy).
# Postgres 5432 / Kafka 9092 bind to 127.0.0.1 only — never exposed.
# Spark + producer still run from startup/<platform>/start.sh (data plane).
# ---------------------------------------------------------------------------
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sma-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: sma-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sentiment
      POSTGRES_PASSWORD: sentiment
      POSTGRES_DB: sentiment
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment -d sentiment"]
      interval: 5s
      timeout: 5s
      retries: 12

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nginx
    container_name: sentio-nginx
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot
    extra_hosts:
      # nginx proxies /api to the uvicorn process on the HOST (started by
      # startup/<platform>/start.sh) — host-gateway makes this work on Linux
      # too (Docker Desktop maps it natively on mac/windows)
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
    # same volume the dev compose (docker-compose.yml) uses — prod and dev
    # share the scored data + users table (no re-seed, no data split)
    name: socialmedia_pgdata
