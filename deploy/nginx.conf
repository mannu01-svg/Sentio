# Sentio reverse proxy — TLS termination + static frontend + API passthrough.
# Serves the built SPA (frontend/dist) and proxies /api -> uvicorn:8000.
# Public surface: 80 (redirect) + 443 (TLS). Everything else stays localhost.

server {
    listen 80;
    server_name _;

    # ACME challenge for a later Let's Encrypt swap
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # self-signed cert generated by deploy/gen-certs.sh at deploy time
    # (swap for Let's Encrypt: certbot certonly --webroot -w /var/www/certbot ...)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # hardening headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # built SPA (frontend/dist, mounted read-only)
    root /usr/share/nginx/html;
    index index.html;

    # API -> uvicorn on the HOST (extra_hosts: host.docker.internal -> host-gateway)
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # keyword/topic streams fetch live comments (~15-60s)
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
    }

    # static assets + SPA fallback (React Router deep links)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
