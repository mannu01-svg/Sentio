server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # API, health check and Swagger UI / OpenAPI spec -> FastAPI container
    location ~ ^/(api|health|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;      # account/topic analyses fetch many posts
    }

    # React router: unknown paths serve the app
    location / {
        try_files $uri /index.html;
    }
}
