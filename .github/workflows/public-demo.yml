# Sentio public demo (cloud deployment, no card, no server to rent).
#
#   GitHub -> Actions -> "Public demo" -> Run workflow
#
# A GitHub-hosted cloud VM (4 vCPU, 16 GB RAM) builds and runs the SAME
# docker-compose.yml used on the laptop - Kafka, Spark, PostgreSQL, MongoDB,
# API, nginx - then publishes it over HTTPS through a Cloudflare quick tunnel.
# The public https:// URL and logins appear in the run's Summary page.
#
# Runs are ephemeral: up to ~6 h (GitHub's job limit), fresh data every run.
# Start it ~25 minutes before the demo: building and starting takes ~15-20 min.

name: Public demo

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Keep the demo alive (minutes, max 330)"
        required: false
        default: "300"
      fast_mode:
        description: "Fast mode: VADER only, skip the transformer models (starts faster)"
        type: boolean
        required: false
        default: false

concurrency:
  group: public-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      SKIP_BERT: ${{ inputs.fast_mode && '1' || '' }}
      SPARK_MASTER: "local[3]"
      NLP_TORCH_THREADS: "2"
      # YouTube blocks cloud IPs for yt-dlp; with this repo secret Sentio uses the
      # official YouTube Data API instead (free key, no card).
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Runner specs
        run: |
          echo "cores: $(nproc)  ram: $(free -g | awk '/^Mem:/{print $2}') GB  disk free: $(df -h / | awk 'NR==2{print $4}')"
          docker --version; docker compose version

      - name: Build images
        run: docker compose build

      # ---- start the whole stack ------------------------------------------------
      - name: Start Sentio (docker compose)
        run: |
          docker compose up -d
          echo "waiting for the API and dashboard..."
          for i in $(seq 1 150); do
            curl -sf http://localhost:5173/health > /dev/null && break
            sleep 4
          done
          docker compose ps
          curl -s http://localhost:5173/health; echo

      # ---- public HTTPS URL: Cloudflare quick tunnel -> nginx -------------------
      - name: Open HTTPS tunnel
        run: |
          mkdir -p logs
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb > /dev/null
          nohup cloudflared tunnel --url http://localhost:5173 --logfile logs/cloudflared.log > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" logs/cloudflared.log 2>/dev/null | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { echo "tunnel failed"; cat logs/cloudflared.log; exit 1; }
          echo "PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/login" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 3
          done
          echo "tunnel: $URL -> HTTP $CODE"

      - name: Publish the demo URL (Summary page)
        run: |
          {
            echo "# 🟢 Sentio is live"
            echo
            echo "## $PUBLIC_URL"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Admin | \`admin@sentio.app\` / \`admin123\` |"
            echo "| Demo user | \`ada@sentio.app\` / \`secret123\` |"
            echo "| Swagger | $PUBLIC_URL/docs |"
            if [ -n "$YOUTUBE_API_KEY" ]; then
              echo "| YouTube links | ✅ via YouTube Data API |"
            else
              echo "| YouTube links | ⚠️ add repo secret YOUTUBE_API_KEY (cloud IPs are blocked) |"
            fi
            echo "| Mode | ${SKIP_BERT:+fast (VADER only)}${SKIP_BERT:-full (VADER + DistilBERT + RoBERTa)} |"
            echo
            echo "Runs on a GitHub-hosted VM with Docker Compose (Kafka, Spark, PostgreSQL, MongoDB, FastAPI, nginx)."
            echo "HTTPS is terminated by Cloudflare. The demo ends when this job ends (~${{ inputs.keep_alive_minutes || '300' }} min) - cancel the run to stop it early."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PUBLIC URL: $PUBLIC_URL"

      - name: Smoke test through the public URL
        continue-on-error: true
        run: |
          curl -s "$PUBLIC_URL/health"; echo
          curl -s -X POST "$PUBLIC_URL/api/login" -H 'Content-Type: application/json' \
            -d '{"email":"ada@sentio.app","password":"secret123"}' | head -c 120; echo
          curl -s "$PUBLIC_URL/api/summary" | head -c 200; echo

      - name: Keep demo alive
        timeout-minutes: 335
        run: |
          echo "demo is up at $PUBLIC_URL - cancel the run to end it"
          END=$((SECONDS + ${{ inputs.keep_alive_minutes || 300 }} * 60))
          while [ $SECONDS -lt $END ]; do
            sleep 120
            curl -sf -o /dev/null http://localhost:5173/health || { echo "health check failed"; docker compose ps; }
          done

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail 80
