# Sentio: the whole stack in Docker (Windows, macOS and Linux alike).
#
#   docker compose up -d --build        start everything (first build ~15-25 min)
#   http://localhost:5173               dashboard  (admin@sentio.app / admin123)
#   http://localhost:8000/docs          Swagger UI (also at http://localhost:5173/docs)
#   http://localhost:4040               Spark UI
#   docker compose down                 stop (data kept)    |   down -v  = wipe data
#
#   producer --> Kafka comments-raw ------\
#                                           > Spark (VADER + DistilBERT + RoBERTa) --> PostgreSQL
#   API analyses --> Kafka comments-analyze /                                     \--> Kafka comments-scored
#   API analyses --> MongoDB (raw comments + analysis documents)

name: sentio        # fixed project name -> volumes are sentio_pgdata, sentio_mongodata, ...

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile.app
  image: sentio-app:latest
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:29092
    KAFKA_ANALYZE_TOPIC: comments-analyze
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: sentiment
    PG_USER: sentiment
    PG_PASSWORD: sentiment
    PG_DSN: host=postgres port=5432 dbname=sentiment user=sentiment password=sentiment
    MONGO_URI: mongodb://mongodb:27017
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    MONGO_DB: sentio
    LIVE_CONTROL: /shared/live-stream.json
    HF_HOME: /models/huggingface

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: sma-kafka
    ports:
      - "9092:9092"                 # host tools (localhost:9092); containers use kafka:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # one-shot: create the three topics before anything produces or consumes
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in comments-raw comments-analyze comments-scored; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3
        done
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: sma-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentiment
      POSTGRES_PASSWORD: sentiment
      POSTGRES_DB: sentiment
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sentiment -d sentiment"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    container_name: sma-mongodb
    ports:
      - "27017:27017"               # MongoDB Compass: mongodb://localhost:27017
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # one-shot: download the two sentiment models into a volume (first run only, ~750 MB)
  models:
    <<: *app
    environment:
      <<: *app-env
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    # a failed download must not block the pipeline: Spark then scores with VADER only
    command: ["sh", "-c", "python scripts/warmup_models.py || echo 'WARNING: model download failed - Spark will score with VADER until the next start'"]
    volumes:
      - hf-cache:/models/huggingface
    restart: "no"

  spark:
    <<: *app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      models:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      CHECKPOINT_DIR: /data/checkpoints
      SKIP_BERT: ${SKIP_BERT:-}                       # SKIP_BERT=1 -> VADER only (fast mode)
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}         # local[4] if Docker has 10+ GB RAM
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      NLP_TORCH_THREADS: ${NLP_TORCH_THREADS:-2}
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-2000}
    command: ["python", "-X", "faulthandler", "spark/streaming_job.py"]
    ports:
      - "4040:4040"
    volumes:
      - hf-cache:/models/huggingface
      - checkpoints:/data/checkpoints
    restart: unless-stopped

  api:
    <<: *app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command:
      - sh
      - -c
      - python scripts/seed_demo_user.py; python scripts/seed_admin.py; exec uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - shared:/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  producer:
    <<: *app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - exec python producer/producer.py --file data/raw/all_sources.csv --seed ${SEED_ROWS:-6000} --shuffle
    volumes:
      - shared:/shared
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: sentio-frontend:latest
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  hf-cache:
  checkpoints:
  shared:
